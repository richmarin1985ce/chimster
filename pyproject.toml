[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "chimster-workshop"
version = "0.2.0.dev0"
description = "Local-first Bethesda modding workbench prototype"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
[project.optional-dependencies]
archives = ["lz4>=4.3,<5"]
textures = ["Pillow>=10,<13"]
viewport = ["moderngl>=5.12,<6", "Pillow>=10,<13"]
advanced-viewport = ["panda3d==1.10.16", "Pillow>=10,<13"]
[project.scripts]
chimster = "chimster.cli:main"
[tool.setuptools.packages.find]
include = ["chimster*"]
[tool.setuptools.package-data]
chimster = ["tools.json", "xedit_scripts/*.pas"]
