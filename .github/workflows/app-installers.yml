name: Versioned application installers
on:
  pull_request:
    paths:
      - 'chimster/**'
      - 'scripts/build_app_release.py'
      - '.github/workflows/app-installers.yml'
      - 'pyproject.toml'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[viewport,advanced-viewport]" "pyinstaller>=6.12,<7"
      - run: python -m scripts.build_app_release
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: release-output/*
          if-no-files-found: error
