name: Preview builds
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[viewport]"
      - run: python -m unittest discover -s tests -v
        env:
          CHIMSTER_TEST_PILLOW: '1'
      - run: python -m pip install build pyinstaller
      - run: python -m build
      - run: python tools/check_manual_package.py
      - run: python -m PyInstaller --onedir --name chimster --paths . --collect-data chimster --add-data "docs:chimster/manual" --hidden-import chimster.ui --collect-submodules PIL --collect-all moderngl --collect-all glcontext --distpath preview build_entry.py
      - name: Verify offline manual in executable
        shell: python
        run: |
          import subprocess, json, pathlib, sys
          exe = pathlib.Path("preview/chimster") / ("chimster.exe" if sys.platform == "win32" else "chimster")
          pages = json.loads(subprocess.check_output([str(exe.resolve()), "wiki", "list"], text=True, encoding="utf-8"))
          assert any(p["id"] == "lod-forge.md" for p in pages)
          print("Verified executable manual:", len(pages), "pages")
      - name: Verify bundled OpenGL rendering on Linux
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          preview/chimster/chimster render-preview bundled-preview.png --backend egl --width 320 --height 240
      - uses: actions/upload-artifact@v4
        with:
          name: chimster-preview-${{ matrix.os }}
          path: |
            preview/
            dist/
