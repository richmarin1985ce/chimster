name: Legacy NIF roundtrip
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyFFI==2.2.3
      - run: python -m unittest discover -s tests -p test_nif_export.py -v
        env:
          CHIMSTER_TEST_PYFFI: '1'
      - run: python -m chimster lod benchmark --count 10 --size 64
