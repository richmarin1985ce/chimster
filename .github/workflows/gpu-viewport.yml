name: OpenGL viewport integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  egl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHIMSTER_TEST_GL: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - run: python -m pip install ".[viewport]"
      - run: python -m unittest discover -s tests -p test_gpu_viewport.py -v
      - run: |
          mkdir renders
          python -m chimster render-preview renders/near.png --backend egl --lod 500 1000 1500
          python -m chimster render-preview renders/far.png --backend egl --lod 1 2 3
      - uses: actions/upload-artifact@v4
        with:
          name: chimster-viewport-render-tests
          path: renders/
